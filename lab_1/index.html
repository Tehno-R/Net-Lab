<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор треугольника</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Калькулятор треугольника</h1>

        <label for="inputType">Выберите тип данных:</label>
        <select id="inputType">
            <option value="twoSidesAngle">Две стороны и угол</option>
            <option value="threeSides">Три стороны</option>
        </select>
        <button id="showInputs">Показать</button>

        <div id="imageContainer">
            <img id="triangleImage" src="triangle1.png" alt="Треугольник">
        </div>

        <div id="inputs">
            <label id="label1" for="input1">Сторона a:</label>
            <input type="number" id="input1" min="0">
            
            <label id="label2" for="input2">Сторона b:</label>
            <input type="number" id="input2" min="0">
            
            <label id="label3" for="input3">Угол C (°):</label>
            <input type="number" id="input3" min="0" max="180">
        </div>

        <label for="calculations">Выберите характеристики:</label>
        <select id="calculations" multiple>
            <option value="height">Высоты</option>
            <option value="circumradius">Радиус описанной окружности</option>
            <option value="inradius">Радиус вписанной окружности</option>
            <option value="area">Площадь</option>
        </select>

        <div class="buttons">
            <button id="calculate">Вычислить</button>
            <button id="clear">Очистить</button>
        </div>

        <div id="results"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
